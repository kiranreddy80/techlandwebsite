  <!-- Boot loader.
       The React <PageLoader> only appears once the bundle has parsed and
       React has mounted — which locally is milliseconds, so it flashed by
       unseen, and before it the screen was simply blank. This markup ships
       inside the HTML, so it paints on the very first frame of every refresh.
       main.jsx removes it once the app is up. Same design as PageLoader. -->
  <style>
    #boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      background: #ffffff;
      overflow: hidden;
      transition: opacity .45s ease, visibility .45s;
    }
    #boot.is-out { opacity: 0; visibility: hidden; }
    #boot .boot-orb { position: absolute; border-radius: 999px; filter: blur(110px); }
    #boot .boot-orb--a {
      width: 460px; height: 460px; top: -150px; left: -130px;
      background: radial-gradient(closest-side, rgba(22,49,152,.22), transparent);
      animation: bootDrift 9s ease-in-out infinite alternate;
    }
    #boot .boot-orb--b {
      width: 500px; height: 500px; bottom: -180px; right: -150px;
      background: radial-gradient(closest-side, rgba(124,58,237,.22), transparent);
      animation: bootDrift 11s ease-in-out infinite alternate-reverse;
    }
    @keyframes bootDrift {
      from { transform: translate3d(0,0,0) scale(1); }
      to   { transform: translate3d(30px,24px,0) scale(1.08); }
    }
    #boot .boot-stage {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 30px;
    }
    /* The mark sits on a real 3D stage and turns while the blocks light,
       so the loader reads as an object rather than a flat sprite. */
    #boot .boot-3d { perspective: 900px; }
    #boot .boot-blocks {
      display: grid;
      grid-template-columns: repeat(3, 22px);
      grid-template-rows: repeat(3, 22px);
      gap: 8px;
      transform-style: preserve-3d;
      animation: bootSpin 4.5s cubic-bezier(.6,.05,.35,.95) infinite;
    }
    @keyframes bootSpin {
      0%   { transform: rotateX(-24deg) rotateZ(-45deg) rotateY(0deg); }
      50%  { transform: rotateX(-24deg) rotateZ(-45deg) rotateY(180deg); }
      100% { transform: rotateX(-24deg) rotateZ(-45deg) rotateY(360deg); }
    }
    #boot .boot-block {
      border-radius: 5px;
      background: linear-gradient(140deg, #163198, #4f46e5 55%, #7c3aed);
      /* Each block is lifted off the plane by its own amount, so the grid has
         genuine depth as it turns instead of being a rotating decal. */
      transform: translateZ(var(--z, 0px)) scale(.7);
      opacity: .12;
      box-shadow: 0 6px 14px -6px rgba(22,49,152,.5);
      animation: bootBlock 1.8s cubic-bezier(.22,1,.36,1) infinite;
    }
    @keyframes bootBlock {
      0%, 70%, 100% { opacity: .12; transform: translateZ(var(--z,0px)) scale(.7); }
      22%           { opacity: 1;   transform: translateZ(calc(var(--z,0px) + 16px)) scale(1); }
      45%           { opacity: .4;  transform: translateZ(var(--z,0px)) scale(.86); }
    }
    #boot .boot-word {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    #boot .boot-main {
      font-family: 'Play', system-ui, sans-serif;
      font-size: 1.7rem; font-weight: 700; letter-spacing: .16em;
      background: linear-gradient(120deg, #163198, #4f46e5 45%, #7c3aed);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: bootFlow 3.2s ease-in-out infinite;
    }
    @keyframes bootFlow {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    #boot .boot-sub {
      font-family: ui-monospace, monospace;
      font-size: 9.5px; font-weight: 700; letter-spacing: .34em;
      text-transform: uppercase; color: rgba(10,10,10,.38);
    }
    #boot .boot-bar {
      position: relative; width: 170px; height: 3px;
      border-radius: 3px; background: rgba(10,10,10,.07); overflow: hidden;
    }
    #boot .boot-bar i {
      position: absolute; top: 0; bottom: 0; width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #163198, #4f46e5, #7c3aed);
      animation: bootShuttle 1.25s cubic-bezier(.55,0,.45,1) infinite;
    }
    @keyframes bootShuttle { 0% { left: -45%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #boot .boot-orb--a, #boot .boot-orb--b, #boot .boot-main { animation: none; }
      #boot .boot-blocks { animation: none; transform: rotateX(-24deg) rotateZ(-45deg); }
      #boot .boot-block { animation: none; opacity: 1; transform: translateZ(var(--z,0px)) scale(1); }
      #boot .boot-bar i { animation-duration: 2.4s; }
    }
  </style>
